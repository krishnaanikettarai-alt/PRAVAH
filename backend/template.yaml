AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PRAVAH serverless API foundation

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        STAGE: !Ref Stage

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage used by the backend configuration

Resources:
  PravahApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub pravah-api-${Stage}
      StageName: !Ref Stage
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,OPTIONS'"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/health.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref PravahApi
            Path: /health
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/health.ts
        External:
          - "@aws-sdk/*"
        Minify: false
        Sourcemap: true
        Target: es2022

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/reports.handler
      Environment:
        Variables:
          REPORTS_TABLE_NAME: !Ref ReportsTable
          DYNAMODB_ENDPOINT: ""
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Scan
              Resource: !GetAtt ReportsTable.Arn
      Events:
        CreateReport:
          Type: Api
          Properties:
            RestApiId: !Ref PravahApi
            Path: /reports
            Method: post
        ListReports:
          Type: Api
          Properties:
            RestApiId: !Ref PravahApi
            Path: /reports
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/reports.ts
        Minify: false
        Sourcemap: true
        Target: es2022

  RiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/risk.handler
      Events:
        CalculateRisk:
          Type: Api
          Properties:
            RestApiId: !Ref PravahApi
            Path: /risk/calculate
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/risk.ts
        Minify: false
        Sourcemap: true
        Target: es2022

  WeatherRiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/weatherRisk.handler
      Events:
        WeatherRisk:
          Type: Api
          Properties:
            RestApiId: !Ref PravahApi
            Path: /risk/weather
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/weatherRisk.ts
        Minify: false
        Sourcemap: true
        Target: es2022

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pravah-reports-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
